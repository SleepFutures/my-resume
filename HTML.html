HTML
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Ultra - Apple (中国大陆风格模仿)</title>
    <!-- 引入类似 Apple 官网使用的字体 (SF Pro 风格) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        /* --- 1. 全局样式重置与变量 --- */
        :root {
            --bg-color: #000000;
            --text-color: #f5f5f7;
            --text-secondary: #86868b;
            --link-color: #2997ff;
            --nav-bg: rgba(22, 22, 23, 0.8);
            --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        a:hover {
            text-decoration: underline;
        }

        /* --- 2. 顶栏导航 (磨砂玻璃效果) --- */
        .global-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 44px;
            background-color: var(--nav-nav-bg, rgba(22, 22, 23, 0.8));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9999;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-content {
            max-width: 1024px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 22px;
        }

        .nav-logo {
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 32px;
        }

        .nav-links a {
            color: #cccccc;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: -0.01em;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
            text-decoration: none;
        }

        /* --- 3. Hero 头部主展示区 --- */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 120px;
            text-align: center;
            background: linear-gradient(180deg, #000000 60%, #0b0b0c 100%);
        }

        .headline-container {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.2s;
            z-index: 2;
        }

        .eyebrow {
            font-size: 21px;
            font-weight: 600;
            color: #f5f5f7;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .headline {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -0.005em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .subhead {
            font-size: 24px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .cta-links {
            display: flex;
            gap: 24px;
            font-size: 17px;
        }

        .cta-btn {
            background-color: #0071e3;
            color: white;
            padding: 8px 16px;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 400;
            transition: background 0.2s ease;
        }

        .cta-btn:hover {
            background-color: #0077ed;
            text-decoration: none;
        }

        .cta-link-arrow::after {
            content: " >";
            font-family: sans-serif;
            font-size: 12px;
            display: inline-block;
            margin-left: 4px;
            transition: transform 0.2s ease;
        }
        .cta-link-arrow:hover::after {
            transform: translateX(3px);
        }

        /* 纯 CSS 绘制的科技感几何核心——概念硬件 */
        .product-image-container {
            margin-top: 40px;
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.95);
            animation: fadeInScale 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.6s;
        }

        .product-hardware {
            width: 320px;
            height: 200px;
            background: linear-gradient(135deg, #2c2d30 0%, #131315 100%);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 
                        inset 0 1px 1px rgba(255,255,255,0.2);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 芯片发光核心效果 */
        .chip-core {
            width: 80px;
            height: 80px;
            background: #000;
            border-radius: 12px;
            border: 2px solid #3a3b3e;
            box-shadow: 0 0 30px rgba(41, 151, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .chip-core::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(41, 151, 255, 0.6), transparent 50%);
            animation: rotateGlow 4s linear infinite;
        }

        /* --- 4. Product Matrix 产品矩阵网格区 --- */
        .grid-section {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background-color: #000;
        }

        .grid-item {
            height: 500px;
            background-color: #161617;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            text-align: center;
        }

        .grid-item h3 {
            font-size: 40px;
            font-weight: 600;
            color: #f5f5f7;
        }

        .grid-item p {
            font-size: 19px;
            color: var(--text-secondary);
            margin-top: 4px;
            margin-bottom: 12px;
        }

        /* 矩阵卡片内部微件 */
        .grid-visual-1 {
            width: 200px;
            height: 200px;
            margin-top: auto;
            margin-bottom: 40px;
            background: radial-gradient(circle, #2997ff 0%, transparent 70%);
            opacity: 0.6;
            filter: blur(10px);
        }

        .grid-visual-2 {
            width: 250px;
            height: 120px;
            margin-top: auto;
            margin-bottom: 60px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
        }

        /* --- 5. 动画效果定义 --- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes rotateGlow {
            100% {
                transform: rotate(360deg);
            }
        }

        /* --- 6. 响应式布局 (移动端适配) --- */
        @media (max-width: 768px) {
            .nav-links {
                display: none; /* 简化移动端，隐藏菜单 */
            }
            .headline {
                font-size: 40px;
            }
            .subhead {
                font-size: 19px;
            }
            .grid-section {
                grid-template-columns: 1fr;
            }
            .grid-item {
                height: 450px;
            }
        }
    </style>
</head>
<body>

    <!-- 顶栏导航 -->
    <nav class="global-nav">
        <div class="nav-content">
            <div class="nav-logo"></div>
            <ul class="nav-links">
                <li><a href="#">商店</a></li>
                <li><a href="#">Mac</a></li>
                <li><a href="#">iPad</a></li>
                <li><a href="#">iPhone</a></li>
                <li><a href="#">Watch</a></li>
                <li><a href="#">Support</a></li>
            </ul>
            <div style="font-size: 18px; cursor: pointer;">⚡</div>
        </div>
    </nav>

    <!-- 主产品 Hero 区域 -->
    <section class="hero-section">
        <div class="headline-container">
            <p class="eyebrow">全新推出</p>
            <h1 class="headline">Studio Ultra</h1>
            <p class="subhead">科技，重塑想象力。</p>
            <div class="cta-links">
                <a href="#" class="cta-btn">购买</a>
                <a href="#" class="cta-link-arrow">了解更多</a>
            </div>
        </div>

        <!-- 模拟官网的高级质感硬件形态 -->
        <div class="product-image-container">
            <div class="product-hardware">
                <div class="chip-core"></div>
            </div>
        </div>
    </section>

    <!-- 底部双列矩阵卡片 -->
    <section class="grid-section">
        <div class="grid-item">
            <h3>M5 Ultra</h3>
            <p>怪兽级性能，更进一步。</p>
            <div class="cta-links" style="font-size: 15px;">
                <a href="#" class="cta-link-arrow">了解 M5 芯片</a>
            </div>
            <div class="grid-visual-1"></div>
        </div>
        <div class="grid-item">
            <h3>Pro Display XDR</h3>
            <p>光影，震撼开场。</p>
            <div class="cta-links" style="font-size: 15px;">
                <a href="#" class="cta-link-arrow">了解显示屏</a>
            </div>
            <div class="grid-visual-2"></div>
        </div>
    </section>

</body>
</html>
